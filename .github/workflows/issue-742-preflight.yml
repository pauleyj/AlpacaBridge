name: Issue 742 native arm64 pre-flight

on:
  push:
    branches: [validation/742-arm64-preflight]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-742-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Checkout the fix commit, excluding this fork-only workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 36db8236925dce69a57cc863a09f56f51db4cbf9
          fetch-depth: 0
          persist-credentials: false

      - name: Verify native architecture and fetch the PR base
        run: |
          set -euo pipefail
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = aarch64
          test "$(dpkg --print-architecture)" = arm64
          test "$(git rev-parse HEAD)" = 36db8236925dce69a57cc863a09f56f51db4cbf9
          git fetch --no-tags https://github.com/open-astro/AlpacaBridge.git main:refs/remotes/upstream/main
          mkdir -p AlpacaCore/build-preflight-evidence
          {
            uname -a
            git show -s --format=fuller HEAD
            git rev-parse upstream/main
            git status --short
          } | tee AlpacaCore/build-preflight-evidence/provenance.log

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-yaml clang-format clang-tidy ccache shellcheck nodejs

      - name: Reuse the repository CI dependency and SDK setup
        run: |
          /usr/bin/python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          import yaml

          ci = yaml.safe_load(Path('.github/workflows/ci.yml').read_text())
          env = os.environ.copy()
          env.update(ci.get('env', {}))
          setup = [
              ('build-vendors', 'Install build dependencies'),
              ('build-vendors', 'Build libgpiod v2 from source'),
              ('build-vendors', 'Stage vendor SDK shared libraries'),
              ('cppcheck', 'Build cppcheck 2.17.x from source'),
          ]
          for job, name in setup:
              step = next(s for s in ci['jobs'][job]['steps'] if s.get('name') == name)
              print(f'CI setup: {name}', flush=True)
              subprocess.run(['bash', '-euo', 'pipefail', '-c', step['run']], env=env, check=True)
          PY

      - name: Run complete pre-flight including ASan, UBSan and TSan
        env:
          PREFLIGHT_BASE: upstream/main
          RUN_TSAN: "1"
        run: |
          set -euo pipefail
          ./scripts/ci_preflight.sh 2>&1 | tee AlpacaCore/build-preflight-evidence/preflight.log

      - name: Preserve diagnostics
        if: always()
        run: |
          mkdir -p AlpacaCore/build-preflight-evidence
          if [ -f /tmp/preflight-tidy.log ]; then
            cp /tmp/preflight-tidy.log AlpacaCore/build-preflight-evidence/tidy.log
          fi

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue-742-native-preflight
          if-no-files-found: error
          path: |
            AlpacaCore/build-preflight-evidence/
            AlpacaCore/build-tsan/stress*.log
            AlpacaCore/build/Testing/Temporary/Last*.log
            AlpacaHTTP/build/Testing/Temporary/Last*.log
